name: Generate Profile SVG

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: [".github/scripts/generate-profile-svg.js", ".github/workflows/profile-svg.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile SVG from GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/generate-profile-svg.js

      - name: Commit SVG (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet profile.svg; then
            git add profile.svg
            git commit -m "chore: update profile SVG [skip ci]"
            git push
            echo "SVG updated and committed"
          else
            echo "No changes to SVG"
          fi
