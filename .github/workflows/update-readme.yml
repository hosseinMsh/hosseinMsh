name: Personalize & Update README

on:
  # Runs when you first push the repo — instantly personalizes it to your username
  push:
    branches: [main, master]
    paths: [README.md, .github/recent-activity.config.yml]
  # Refreshes dynamic data every 6 hours
  schedule:
    - cron: "0 */6 * * *"
  # Allows manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Auto-detect the repo owner and replace the placeholder username
      # everywhere in the README. This makes the template universal:
      # anyone who copies this repo gets a README personalized to them.
      - name: Personalize README to repository owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$OWNER" != "hosseinMsh" ]; then
            sed -i "s/hosseinMsh/${OWNER}/g" README.md
            sed -i "s/hosseinMsh/${OWNER}/g" PROFILE_README.md
            echo "Personalized README for ${OWNER}"
          else
            echo "README already personalized"
          fi

      - name: Commit personalization (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git add PROFILE_README.md
            git commit -m "chore: personalize README for ${{ github.repository_owner }}"
            git push
          fi

      # Injects your latest public GitHub activity between the
      # RECENT_ACTIVITY:start / RECENT_ACTIVITY:end markers
      # Runs on schedule and manual triggers only (not on push,
      # because the action validates event names case-sensitively)
      - name: Update recent activity section
        if: github.event_name != 'push'
        uses: Readme-Workflows/recent-activity@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          GH_USERNAME: ${{ github.repository_owner }}
          CONFIG_FILE: ./.github/recent-activity.config.yml
